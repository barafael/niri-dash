[package]
name = "niri-dash-system"
version = "0.1.0"
edition = "2024"
description = "The system niri-dash runs on: one actor per applet, behind command and event enums"
license = "MIT OR Apache-2.0"

[dependencies]
log.workspace = true
thiserror.workspace = true
dirs.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
chrono.workspace = true
png.workspace = true

# wayland: the clipboard and night light, on the dashboard's connection
smithay-client-toolkit.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# data sources
niri-ipc = "26.4"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "io-util"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
system-tray = "0.8"
freedesktop-icons = "0.4"
ureq = { version = "2", features = ["json"] }
qrcode = { version = "0.14.1", default-features = false }
nmrs = "3.5.7"

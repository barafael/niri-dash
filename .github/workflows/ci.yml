# Format, lints, tests, and both builds (desktop and browser) on every push and pull request. The
# release workflow runs this one first.
# The tests that run system code (atspi, orca, `live`) skip themselves here: they belong in the
# test box (testbox/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What the desktop build links against: fontconfig, xkbcommon, Wayland and its EGL glue.
  LIBS: pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev
  # What the GPUI build links against on top: FreeType (the text), and the X11 pieces GPUI's X11
  # backend is built with.
  GPUI_LIBS: libfreetype-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml picks the toolchain; rustfmt comes on top.
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      # The GPUI dashboard (`gpui/`) has its own jobs below: it links against more.
      - run: cargo clippy --workspace --exclude niri-dash-gpui --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS
      - uses: Swatinem/rust-cache@v2
      # Everything, headless. The tests that run system code (atspi, orca, live) skip themselves
      # outside the test box.
      - run: cargo test --workspace --exclude niri-dash-gpui --locked

  # The GPUI dashboard, the `gpui` member (gpui/README.md). `testing` is the headless harness its
  # tests are built on; `--profile gpui` optimises its dependencies, which it needs to be quick.
  gpui-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS $GPUI_LIBS
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p niri-dash-gpui --profile gpui --all-targets --features testing --locked -- -D warnings

  gpui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mesa-vulkan-drivers: lavapipe, a software Vulkan, for the snapshot test (it skips itself
      # where there is no GPU).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS $GPUI_LIBS mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      # Headless: GPUI's test platform needs no compositor. The tests that run system code (atspi,
      # orca) skip themselves outside the test box.
      - run: cargo test -p niri-dash-gpui --profile gpui --features testing --locked --no-fail-fast

  # The README and Cargo.toml say Rust 1.95 or newer (what the kdl crate needs). RUSTUP_TOOLCHAIN
  # beats rust-toolchain.toml, which says stable.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude niri-dash-gpui --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # For the Slint compiler, which runs on this machine during the build.
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev

      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Check the browser build
        run: cargo check --target wasm32-unknown-unknown --lib --profile web --locked

  # Packaging problems (missing metadata, files left out) show up here, not at the release. Only
  # niri-dash-system: the dashboard itself can't be packaged until that one is on crates.io.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes $LIBS
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run -p niri-dash-system --locked

  manual:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Build the manual
        run: mdbook build book

# Builds the web version (the Slint variant of the dashboard in slint/, on a simulated system: GPUI
# has no browser build) and the manual, and puts them on GitHub Pages.
name: Web version and manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a deployment still waiting; one already going finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: "0.22.1"
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # For the Slint compiler, which runs on this machine during the build.
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev

      # slint/rust-toolchain.toml picks the toolchain; the browser target comes on top.
      - name: Add the browser target
        run: rustup target add wasm32-unknown-unknown
        working-directory: slint

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slint

      - name: Install Trunk
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      # slint/Trunk.toml: the page is slint/web/index.html, the result goes to slint/dist.
      - name: Build the web version
        run: trunk build --release --cargo-profile web --locked
        working-directory: slint

      # The manual goes next to the web version, at <site>/manual/. Trunk empties dist/ when it
      # builds, so this comes after it.
      - name: Install mdBook
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      # mdBook 0.5 takes --dest-dir relative to where it is run, not to the book (a relative path
      # here once put the manual outside the checkout, and it was never deployed), so the path is
      # spelled out, and a missing page fails the build.
      - name: Build the manual
        run: |
          mdbook build book --dest-dir "$GITHUB_WORKSPACE/slint/dist/manual"
          test -f slint/dist/manual/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: slint/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

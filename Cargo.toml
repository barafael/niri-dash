[package]
name = "niri-dash"
version = "0.1.0"
edition = "2024"
description = "A fullscreen widget dashboard for niri: clock, calendar, windows, wifi, bluetooth, power, tray and more, with a Plasma-style edit mode"
license = "MIT OR Apache-2.0"

[workspace]
members = [".", "crates/system"]

[workspace.dependencies]
log = "0.4"
thiserror = "2"
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
chrono = { version = "0.4", features = ["unstable-locales", "serde"] }
png = "0.17"
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dependencies]
# What the dashboard runs on: it sends this crate's commands and gets its events, nothing else.
niri-dash-system = { path = "crates/system" }
clap = { version = "4", features = ["derive"] }
log.workspace = true
env_logger = "0.11"
thiserror.workspace = true
dirs.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
kdl = "6"
strum.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
png.workspace = true

# ui: no windowing backend, the platform is our own (app.rs) on top of the Wayland crates below.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "renderer-femtovg",
    "software-renderer-path",
    "software-renderer-systemfonts",
] }
# Must match slint's exact version. Used directly for scroll gesture phases (not in Slint's public
# API); its features load images at runtime (icon themes, album art, notification images).
i-slint-core = { version = "=1.18.1", features = ["image-decoders", "svg"] }
# Not used directly: Slint decodes only png and jpeg, this adds the other formats icons come in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

# wayland
smithay-client-toolkit.workspace = true
wayland-client = "0.31"
# client_system: the libwayland connection whose wl_display pointer EGL needs (gpu.rs).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols.workspace = true
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }

# Slint wants one thread and one platform per process: the UI tests are one plain program.
[[test]]
name = "ui"
harness = false

[[test]]
name = "stress"
harness = false

[[test]]
name = "a11y"
harness = false

[[test]]
name = "edit"
harness = false

[build-dependencies]
slint-build = "1.18"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
debug = 1

# Slint 1.18's software renderer doesn't clip paths to the repainted region, so partial repaints
# draw arcs over overlays (tray menus, a widget dragged in from the drawer). Patched copy; see its
# README.md.
[patch.crates-io]
i-slint-renderer-software = { path = "patches/i-slint-renderer-software" }

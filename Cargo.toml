[package]
name = "niri-dash"
version = "0.1.0"
edition = "2024"
description = "A fullscreen widget dashboard for niri: clock, calendar, windows, wifi, bluetooth, power, tray and more, with a Plasma-style edit mode"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "6"
strum = { version = "0.28", features = ["derive"] }
chrono = { version = "0.4", features = ["unstable-locales", "serde"] }
chrono-tz = "0.10"
png = "0.17"

# ui: no windowing backend, the platform is our own (app.rs) on top of the Wayland crates below.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "renderer-femtovg",
    "software-renderer-path",
    "software-renderer-systemfonts",
] }
# Must match slint's exact version. Used directly for scroll gesture phases (not in Slint's public
# API); its features load images at runtime (icon themes, album art, notification images).
i-slint-core = { version = "=1.18.1", features = ["image-decoders", "svg"] }
# Not used directly: Slint decodes only png and jpeg, this adds the other formats icons come in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

# wayland
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
# client_system: the libwayland connection whose wl_display pointer EGL needs (gpu.rs).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }

# data sources
niri-ipc = "26.4"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "io-util"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
system-tray = "0.8"
freedesktop-icons = "0.4"
ureq = { version = "2", features = ["json"] }
qrcode = { version = "0.14.1", default-features = false }

[build-dependencies]
slint-build = "1.18"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
debug = 1

# Slint 1.18's software renderer doesn't clip paths to the repainted region, so partial repaints
# draw arcs over overlays (tray menus, a widget dragged in from the drawer). Patched copy; see its
# README.md.
[patch.crates-io]
i-slint-renderer-software = { path = "patches/i-slint-renderer-software" }

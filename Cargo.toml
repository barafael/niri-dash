[package]
name = "niri-dash"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fullscreen widget dashboard for niri: clock, calendar, windows, wifi, bluetooth, power, tray and more, with a Plasma-style edit mode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/barafael/niri-dash"
readme = "README.md"
keywords = ["niri", "wayland", "dashboard", "widgets", "slint"]
categories = ["gui"]
# The manual's pictures and tooling, the web build, the test box and the patched renderer stay out
# of the package. The manual's text stays: a test checks the widget tables in it.
exclude = [
    "/.cargo",
    "/.github",
    "/book/css",
    "/book/mermaid*",
    "/book/screenshots.sh",
    "/book/src/images",
    "/dist",
    "/docs",
    "/patches",
    "/testbox",
    "/Trunk.toml",
    "/web",
    "/xtask",
]

[workspace]
# The root package is the Slint dashboard. `gpui` is the same dashboard on GPUI: `cargo build` and
# `cargo test` here build only the root package; the other one is `-p niri-dash-gpui` (see
# `gpui/README.md`).
members = [".", "crates/system", "xtask", "gpui"]

[workspace.dependencies]
log = "0.4"
thiserror = "2"
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
chrono = { version = "0.4", features = ["unstable-locales", "serde"] }
png = "0.17"
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dependencies]
# What the dashboard runs on: it sends this crate's commands and gets its events, nothing else.
niri-dash-system = { path = "crates/system", version = "0.1.0" }
log.workspace = true
thiserror.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
kdl = "6"
strum.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
png.workspace = true
# std::time, which panics in a browser, with what works there; the same types on the desktop.
web-time = "1"

# ui: no windowing backend, the platform is our own (app.rs) on top of Wayland or a canvas.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg",
] }
# Must match slint's exact version. Used directly for scroll gesture phases (not in Slint's public
# API); its features load images at runtime (icon themes, album art, notification images).
i-slint-core = { version = "=1.18.1", features = ["image-decoders", "svg"] }
# Not used directly: Slint decodes only png and jpeg, this adds the other formats icons come in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
notify.workspace = true
slint = { version = "1.18", default-features = false, features = [
    "renderer-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
] }

# Screen readers: the dashboard's accessible tree, published over AT-SPI (src/app/a11y). The
# accesskit version is the one i-slint-core's own text accessibility uses.
accesskit = "0.24"
accesskit_unix = { version = "0.22", default-features = false, features = ["tokio"] }

# wayland
smithay-client-toolkit.workspace = true
wayland-client = "0.31"
# client_system: the libwayland connection whose wl_display pointer EGL needs (gpu.rs).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols.workspace = true
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }

# The web version: a canvas, the page's events, and localStorage for files.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must match slint's exact version: drawing on a canvas isn't in Slint's public API.
i-slint-renderer-femtovg = { version = "=1.18.1", features = ["opengl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Clipboard",
    "ClipboardEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Storage",
    "UrlSearchParams",
    "WheelEvent",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
accesskit_consumer = "0.38"

# Slint wants one thread and one platform per process: the UI tests are one plain program.
[[test]]
name = "ui"
harness = false

[[test]]
name = "stress"
harness = false

[[test]]
name = "a11y"
harness = false

[[test]]
name = "edit"
harness = false

[[test]]
name = "access"
harness = false

[[test]]
name = "atspi"
harness = false

[[test]]
name = "orca"
harness = false

[build-dependencies]
slint-build = "1.18"

# What the GPUI dashboard is built and tested with (`cargo gtest`, `cargo gbuild`, `--profile gpui`):
# its dependencies (taffy, the text system, the renderer) are far too slow unoptimised for the
# headless tests and the stress run. Only a workspace root can set a profile, and the default
# `dev` stays as it is for the Slint dashboard.
[profile.gpui]
inherits = "dev"
opt-level = 1
[profile.gpui.package."*"]
opt-level = 3

# The web version: as small as it gets, since every visitor downloads it.
[profile.web]
inherits = "release"
debug = 0
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Slint 1.18's software renderer doesn't clip paths to the repainted region, so partial repaints
# draw arcs over overlays (tray menus, a widget dragged in from the drawer). Patched copy; see its
# README.md.
[patch.crates-io]
i-slint-renderer-software = { path = "patches/i-slint-renderer-software" }
